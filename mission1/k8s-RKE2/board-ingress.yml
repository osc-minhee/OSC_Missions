apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: board-ingress
  namespace: board
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - board.local.rke2
      secretName: board-tls-secret
  rules:
    - host: board.local.rke2
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: board-fe
                port:
                  number: 8081