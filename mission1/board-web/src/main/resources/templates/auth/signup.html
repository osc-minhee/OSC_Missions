<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>회원가입</h1>

    <div th:if="${apiError}" class="alert alert-error" th:text="${apiError}"></div>

    <form th:action="@{/signup}" th:object="${form}" method="post">
        <div class="field">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="field">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" th:field="*{nickname}">
            <span class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>
        </div>

        <div class="actions">
            <button type="submit">가입하기</button>
            <a th:href="@{/login}">로그인으로</a>
        </div>
    </form>
</div>
</body>
</html>
