<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? '게시글 작성' : '게시글 수정'">게시글</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="nav">
        <a th:href="@{/boards}">게시판</a>
        <div th:if="${loginUser != null}">
            <span th:text="${loginUser.nickname} + '님'"></span>
            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit">로그아웃</button>
            </form>
        </div>
    </div>

    <h1 th:text="${mode == 'create'} ? '게시글 작성' : '게시글 수정'"></h1>

    <div th:if="${apiError}" class="alert alert-error" th:text="${apiError}"></div>

    <form th:action="${mode == 'create'} ? @{/boards} : @{/boards/{id}(id=${boardId})}"
          th:object="${form}" method="post">
        <div class="field">
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}">
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="field">
            <label for="description">내용</label>
            <textarea id="description" rows="8" th:field="*{description}"></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>

        <div class="actions">
            <button type="submit">저장</button>
            <a th:href="${mode == 'create'} ? @{/boards} : @{/boards/{id}(id=${boardId})}">취소</a>
        </div>
    </form>
</div>
</body>
</html>
