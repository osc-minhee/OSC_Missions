spring:
  application:
    name: board-web
  profiles:
    active: local

server:
  port: ${SERVER_PORT:8081}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

board-api:
  client-type: ${BOARD_API_CLIENT_TYPE:feign} # rest | feign
