name: mission1-board-web CD

on:
  push:
    branches:
      - main
      - feature/auth
    paths:
      - "mission1/board-web/**"
      - ".github/workflows/mission1-board-web-cd.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      container_name: ${{ steps.vars.outputs.container_name }}
      host_port: ${{ steps.vars.outputs.host_port }}
      api_port: ${{ steps.vars.outputs.api_port }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        working-directory: mission1/board-web
        run: mvn -B clean package -DskipTests

      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              TAG="main-${SHORT_SHA}"
              CONTAINER="board-web-main"
              PORT="8090"
              API_PORT="8080"
              ;;
            feature/auth)
              TAG="auth-${SHORT_SHA}"
              CONTAINER="board-web-auth"
              PORT="8091"
              API_PORT="8081"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/board-web:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "container_name=${CONTAINER}" >> "$GITHUB_OUTPUT"
          echo "host_port=${PORT}" >> "$GITHUB_OUTPUT"
          echo "api_port=${API_PORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mission1/board-web
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          CONTAINER_NAME: ${{ needs.build-and-push.outputs.container_name }}
          HOST_PORT: ${{ needs.build-and-push.outputs.host_port }}
          BOARD_API_BASE_URL: http://${{ secrets.DEV_SERVER_HOST }}:${{ needs.build-and-push.outputs.api_port }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.FE_DEV_SERVER_HOST }}
          username: ${{ secrets.FE_DEV_SERVER_USER }}
          key: ${{ secrets.FE_DEV_SERVER_SSH_KEY }}
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,BOARD_API_BASE_URL,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker pull "${IMAGE}"
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            ENV_FILE=$(mktemp)
            cat > "${ENV_FILE}" <<EOF
            SPRING_PROFILES_ACTIVE=prod
            BOARD_API_BASE_URL=${BOARD_API_BASE_URL}
            EOF

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${HOST_PORT}:8081" \
              --env-file "${ENV_FILE}" \
              "${IMAGE}"

            rm -f "${ENV_FILE}"
