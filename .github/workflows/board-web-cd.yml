name: board-web CD

on:
  push:
    branches:
      - main
      - feature/auth
    paths:
      - "mission1/board-web/**"
      - ".github/workflows/board-web-cd.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        working-directory: mission1/board-web
        run: mvn -B clean package -DskipTests

      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              TAG="main-${SHORT_SHA}"
              ;;
            feature/auth)
              TAG="auth-${SHORT_SHA}"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/missions:web-${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mission1/board-web
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, board-web]
    environment: mission1
    steps:
      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:web-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-web-main" >> "$GITHUB_OUTPUT"
              echo "host_port=8090" >> "$GITHUB_OUTPUT"
              echo "api_port=8080" >> "$GITHUB_OUTPUT"
              ;;
            feature/auth)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:web-auth-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-web-auth" >> "$GITHUB_OUTPUT"
              echo "host_port=8091" >> "$GITHUB_OUTPUT"
              echo "api_port=8081" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Deploy on server
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          CONTAINER_NAME: ${{ steps.vars.outputs.container_name }}
          HOST_PORT: ${{ steps.vars.outputs.host_port }}
          BOARD_API_BASE_URL: http://${{ secrets.DEV_SERVER_HOST }}:${{ steps.vars.outputs.api_port }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker pull "${IMAGE}"
          docker stop "${CONTAINER_NAME}" 2>/dev/null || true
          docker rm "${CONTAINER_NAME}" 2>/dev/null || true

          ENV_FILE=$(mktemp)
          cat > "${ENV_FILE}" <<EOF
          SPRING_PROFILES_ACTIVE=prod
          BOARD_API_BASE_URL=${BOARD_API_BASE_URL}
          EOF

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${HOST_PORT}:8081" \
            --env-file "${ENV_FILE}" \
            "${IMAGE}"

          rm -f "${ENV_FILE}"
