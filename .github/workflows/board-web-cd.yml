name: board-web CD

on:
  push:
    branches:
      - main
      - feature/auth
    paths:
      - "mission1/board-web/**"
      - ".github/workflows/board-web-cd.yml"

jobs:
  build-and-push:
    runs-on: [self-hosted, board-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        working-directory: mission1/board-web
        run: ./mvnw -B clean package -DskipTests

      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              TAG="main-${SHORT_SHA}"
              ;;
            feature/auth)
              TAG="auth-${SHORT_SHA}"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/missions:web-${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mission1/board-web
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, board-api]
    environment: mission1
    steps:
      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:web-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-web-main" >> "$GITHUB_OUTPUT"
              echo "deploy_dir_name=board-fe" >> "$GITHUB_OUTPUT"
              echo "host_port=8090" >> "$GITHUB_OUTPUT"
              echo "api_port=8080" >> "$GITHUB_OUTPUT"
              ;;
            feature/auth)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:web-auth-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-web-auth" >> "$GITHUB_OUTPUT"
              echo "deploy_dir_name=board-fe-auth" >> "$GITHUB_OUTPUT"
              echo "host_port=8091" >> "$GITHUB_OUTPUT"
              echo "api_port=8081" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy on FE server via SSH
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          CONTAINER_NAME: ${{ steps.vars.outputs.container_name }}
          DEPLOY_DIR_NAME: ${{ steps.vars.outputs.deploy_dir_name }}
          HOST_PORT: ${{ steps.vars.outputs.host_port }}
          BOARD_API_BASE_URL: http://${{ secrets.DEV_SERVER_HOST }}:${{ steps.vars.outputs.api_port }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FE_SERVER_HOST: ${{ secrets.FE_SERVER_HOST }}
          FE_DEPLOY_USER: ${{ secrets.FE_DEPLOY_USER }}
        run: |
          KEY_FILE=$(mktemp)
          printf '%s\n' "${{ secrets.FE_DEPLOY_SSH_KEY }}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          ssh -i "${KEY_FILE}" -o StrictHostKeyChecking=accept-new \
            "${FE_DEPLOY_USER}@${FE_SERVER_HOST}" \
            "mkdir -p \"\$HOME/${DEPLOY_DIR_NAME}\" && cat > \"\$HOME/${DEPLOY_DIR_NAME}/docker-compose.yml\"" \
            < mission1/board-web/docker-compose.yml

          ssh -i "${KEY_FILE}" -o StrictHostKeyChecking=accept-new \
            "${FE_DEPLOY_USER}@${FE_SERVER_HOST}" bash -s <<EOF
          set -e

          if sudo systemctl enable docker; then
            echo "docker.service is enabled for boot startup"
          else
            echo "Warning: failed to enable docker.service on boot - check passwordless sudo config on the FE server"
          fi

          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

          DEPLOY_DIR="\${HOME}/${DEPLOY_DIR_NAME}"
          cd "\${DEPLOY_DIR}"

          cat > "\${DEPLOY_DIR}/.env" <<ENV
          IMAGE=${IMAGE}
          CONTAINER_NAME=${CONTAINER_NAME}
          HOST_PORT=${HOST_PORT}
          BOARD_API_BASE_URL=${BOARD_API_BASE_URL}
          ENV

          docker compose pull
          docker compose up -d
          EOF

          rm -f "${KEY_FILE}"
