name: board-api CD

on:
  push:
    branches:
      - main
      - feature/auth
    paths:
      - "mission1/board-api/**"
      - ".github/workflows/board-api-cd.yml"

jobs:
  build-and-push:
    runs-on: [self-hosted, board-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar
        working-directory: mission1/board-api
        run: ./mvnw -B clean package -DskipTests

      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              TAG="main-${SHORT_SHA}"
              ;;
            feature/auth)
              TAG="auth-${SHORT_SHA}"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/missions:api-${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mission1/board-api
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, board-api]
    environment: mission1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve branch-specific settings
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          case "${GITHUB_REF_NAME}" in
            main)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:api-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-api-main" >> "$GITHUB_OUTPUT"
              echo "db_container_name=board-postgres-main" >> "$GITHUB_OUTPUT"
              echo "deploy_dir_name=board-api" >> "$GITHUB_OUTPUT"
              echo "host_port=8080" >> "$GITHUB_OUTPUT"
              ;;
            feature/auth)
              echo "image=${{ secrets.DOCKERHUB_USERNAME }}/missions:api-auth-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
              echo "container_name=board-api-auth" >> "$GITHUB_OUTPUT"
              echo "db_container_name=board-postgres-auth" >> "$GITHUB_OUTPUT"
              echo "deploy_dir_name=board-api-auth" >> "$GITHUB_OUTPUT"
              echo "host_port=8081" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Ensure Docker starts on boot
        run: |
          if sudo systemctl enable docker; then
            echo "docker.service is enabled for boot startup"
          else
            echo "::warning::Failed to enable docker.service on boot - check passwordless sudo config on this runner"
          fi

      - name: Deploy on server
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          CONTAINER_NAME: ${{ steps.vars.outputs.container_name }}
          DB_CONTAINER_NAME: ${{ steps.vars.outputs.db_container_name }}
          DEPLOY_DIR_NAME: ${{ steps.vars.outputs.deploy_dir_name }}
          HOST_PORT: ${{ steps.vars.outputs.host_port }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker network create board-net 2>/dev/null || true

          DEPLOY_DIR="${HOME}/${DEPLOY_DIR_NAME}"
          mkdir -p "${DEPLOY_DIR}"
          cp mission1/board-api/docker-compose.yml "${DEPLOY_DIR}/docker-compose.yml"

          cat > "${DEPLOY_DIR}/.env" <<ENV
          IMAGE=${IMAGE}
          CONTAINER_NAME=${CONTAINER_NAME}
          DB_CONTAINER_NAME=${DB_CONTAINER_NAME}
          HOST_PORT=${HOST_PORT}
          DB_NAME=${DB_NAME}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          ENV

          cd "${DEPLOY_DIR}"
          docker compose pull
          docker compose up -d
