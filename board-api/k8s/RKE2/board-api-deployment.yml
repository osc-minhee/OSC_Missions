apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-api
  namespace: board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: board-api
  template:
    metadata:
      labels:
        app: board-api
    spec:
      containers:
        - name: board-api
          image: minheek/missions:api-k3s
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom: {configMapKeyRef: {name: board-api-config, key: DB_HOST}}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: board-db-secret, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: board-db-secret, key: DB_PASSWORD}}
